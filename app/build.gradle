plugins {
    id 'com.android.application'
}

android {
    namespace 'com.feedreform.highlight'
    compileSdk 36

    defaultConfig {
        applicationId 'com.feedreform.highlight'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.6'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            // 仅调试用测试通道：清单里登记 action 的 TestControlReceiver 只在 debug 启用。
            manifestPlaceholders = [testControlEnabled: 'true']
        }
        release {
            manifestPlaceholders = [testControlEnabled: 'false']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
